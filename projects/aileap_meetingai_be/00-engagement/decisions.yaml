  - id: DEC-002
    type: process
    title: スプリント長 2 週間 × 4 スプリント = 8 週間
    decided_at: 2026-08-04
    decided_by:
      - role: product-director
        name: product-director
      - role: product-manager
        name: product-manager
      - role: backend-lead
        name: backend-lead
      - role: 決裁者

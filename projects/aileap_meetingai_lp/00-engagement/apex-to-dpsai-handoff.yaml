strategic_context:
  business_objective: |
    AILEAP の自社プロダクト MeetingAI(会議要約 + 議事録自動生成 SaaS)の
    β版を 2026 Q3 に開始予定。本 LP はβ版申込み獲得の核となる。
  target_audience: |
    主読者: 中堅企業(従業員 50-300 名)の経営企画 / バックオフィス
    副読者: 個人事業主・スタートアップ初期メンバー
  competitive_position: |
    既存類似サービス(tl;dv / Otter.ai / Notta)に対する AILEAP の差別化:
    1. 日本語特化精度
    2. AILEAP 自身が AI Native 制作会社で運用ナレッジ豊富
    3. WMAO への自動連携で投稿用記事化が一気通貫
  digital_strategy: |
    AILEAP コーポレートサイト(aileap_v2)経由での認知獲得 +
    LP 単独での GEO / SEO 流入獲得の二段構え
  why_web: |
    β版申込みの導線として Web LP が必須。
    aileap_v2 から「サービス → MeetingAI」CTA で誘導 + 直接流入の両方を狙う


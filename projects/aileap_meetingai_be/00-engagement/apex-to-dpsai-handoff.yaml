notes: |
  本案件は AILEAP の自社プロダクト第 1 号として、PMF 検証を含めた完全な B1 SaaS MVP 案件。
  Phase I-B の検証目的:
  - B 系新規エージェント 5 体の本格動員
  - B 系新規スキル 5 個の動作確認
  - PMF gate(Week 4)を実 Shin 判断で動かす
  - WMAO 引継ぎなしの本組織内継続運用パターンの実証

  並列案件 3 件目(aileap_v2 + aileap_meetingai_lp + 本案件)で
  DPSAI_MAX_PARALLEL_PROJECTS=3 の上限テストも兼ねる。

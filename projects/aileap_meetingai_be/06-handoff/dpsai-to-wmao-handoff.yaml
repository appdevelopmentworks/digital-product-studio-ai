status: not_applicable                     # ★ B 系のため引継ぎ実行なし

# ===============================================================
# プロジェクト情報
# ===============================================================
project:
  id: AILEAP-MTG-BE-20260801-001
  client: AILEAP(自社・MeetingAI 事業部・internal_client: true)
  type: B1                                # SaaS MVP
  url: https://meetingai.aileap.example/
  api_url: https://meetingai.aileap.example/api/v1/
  launched_at: 2026-10-05
  post_launch_period_end: 2026-11-04

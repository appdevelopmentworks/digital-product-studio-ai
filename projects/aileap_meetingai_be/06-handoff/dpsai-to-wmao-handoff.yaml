      current_value: 96%
      target_value: 90%+
      target_date: continuous
    - metric: 平均要約精度(ユーザー評価)
      current_value: 4.3
      target_value: 4.0+
      target_date: continuous
    - metric: 月次継続利用率(月 1 回以上)
      current_value: 64%
      target_value: 30%+(目標達成済)
      target_date: continuous


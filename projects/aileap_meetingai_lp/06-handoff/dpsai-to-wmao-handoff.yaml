# ===============================================================
# 引継ぎスコープ(自社プロダクト LP の特殊扱い)
# ===============================================================
handoff_scope:
  type: partial                         # partial(全体運用ではなく一部のみ)
  rationale: |
    本案件は AILEAP 自社プロダクト LP のため、プロダクト責任は本組織内に留まる。
    WMAO に引き継ぐのは「SEO/GEO 月次改善」と「LP 流入分析」のみ。
    LP のコピー / デザイン / 機能更新は本組織内で実施する。
  wmao_takes_over:
    - SEO/GEO 月次改善(B-C1 境界・Day 31 以降)
    - LP 流入分析(GA4 + GSC)
    - A/B テスト施策の提案(本組織が実装判断)
    - aileap_v2 ブログでの MeetingAI 関連記事継続
  dpsai_retains:
    - LP 自体の保守(コピー / デザイン / 機能変更)
    - プロダクト訴求内容更新(MeetingAI の機能アップデート反映)
    - β版 → 正式版移行時の LP リニューアル
    - 重大障害対応


    proposed_by: product-manager
    impacted_agents: [product-manager, backend-engineer, devops-engineer, qa-engineer]
    related_artifacts: [04-implementation/sprint-plans/]
    context: B1 MVP を 2 ヶ月で完走するための sprint cadence 確定。
    decision_rationale: |
      B 系標準 2 週間 sprint(agent-coordination-map.md §11.5)を採用。
      4 スプリントで Sprint 01: setup / Sprint 02: 録音 / Sprint 03: 要約 / Sprint 04: 管理画面。
      PMF gate を Sprint 03 着手前(Week 4 = 2026-09-13)に配置。
    consequences:
      positive: [規律的な進行, PMF gate のタイミング確定]
      negative: [Sprint 04 が短縮(3 日)になる]
      mitigation: [Sprint 04 のスコープを管理画面のみに限定]


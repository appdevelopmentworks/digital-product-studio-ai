      handoff-protocols.md §8.5 / agent-coordination-map.md §11.6 の B 系 PMF Gate 規定。
      Sprint 02 完了時点(録音 upload + Whisper)で「要約品質」を Shin が評価。
      4.0/5.0 未達なら Sprint 03 着手を停止 → プロンプトチューニング後に再評価。
    consequences:
      positive: [pivot/kill コスト最小化]
      negative: [Sprint 03 開始のリスク]
      mitigation: [Sprint 02 完了デモを充実させる]

  - id: DEC-004
    type: technical
    title: 技術スタックを Next.js 14 + Supabase + Vercel に確定
    decided_at: 2026-08-08
    decided_by:
      - role: technology-director
        name: technology-director
      - role: backend-lead
        name: backend-lead
      - role: 決裁者
        name: Shin
    proposed_by: backend-lead
    impacted_agents: [backend-engineer, devops-engineer, frontend-engineer]
    related_artifacts: [04-implementation/architecture-notes.md]
    context: B1 MVP に最適なスタックの選定。
    decision_rationale: |
      - Next.js 14: aileap_v2 / aileap_meetingai_lp と整合 + 管理画面 UI
      - Supabase: Postgres + Auth + Storage + Realtime が一体 → 実装工数 -30%
      - Vercel: 既存運用との整合 + Edge Function で API 配信
      LLM API は Anthropic Claude(主) + OpenAI Whisper(音声 → テキスト)
    consequences:
      positive: [実装工数削減, 既存運用との整合]
      negative: [Supabase Pro プラン費用が発生(月 25 USD〜)]
      mitigation: [β版規模では Free プランでも対応可能・正式版で Pro 移行]

  - id: DEC-005
    type: technical
    title: 認証方式を招待制 + パスワードレス(マジックリンク)に確定
    decided_at: 2026-08-12
    decided_by:
      - role: backend-lead
        name: backend-lead
      - role: backend-engineer
        name: backend-engineer
      - role: product-director
        name: product-director
    proposed_by: backend-engineer
    impacted_agents: [backend-engineer, devops-engineer, qa-engineer]
    related_artifacts: [03-design/api-spec.md]
    context: β版ユーザー認証フローの確定。
    decision_rationale: |
      Supabase Auth の magic link を採用:
      - パスワードレス → セキュリティ + UX 両立
      - 招待制で β版ユーザー数を制御
      - 実装工数最小(Supabase の標準機能)
      SSO は v2.0 で対応(出口に応じた拡張)。
    consequences:
      positive: [実装工数最小, セキュリティ高い]
      negative: [メール到達 SLA(数秒〜数十秒)依存]
      mitigation: [メール送信は Supabase + Resend の二重化で信頼性確保]

  - id: DEC-006
    type: technical
    title: 録音処理を非同期(キュー経由)に確定
    decided_at: 2026-08-22
    decided_by:
      - role: backend-engineer
        name: backend-engineer
      - role: backend-lead
        name: backend-lead
      - role: devops-engineer
        name: devops-engineer
    proposed_by: backend-engineer
    impacted_agents: [backend-engineer, devops-engineer, qa-engineer]
    related_artifacts: [03-design/api-spec.md, 04-implementation/infra-plan.md]
    context: 60 分録音の処理時間が 5-15 分かかるため、同期 API では timeout。
    decision_rationale: |
      アップロード成功 → ジョブキュー投入 → 完了通知の非同期パターン:
      1. POST /api/recordings → Supabase Storage アップロード + ジョブキュー登録 → 即時 200
      2. ワーカー(Vercel Cron / Inngest)が Whisper → Claude で処理
      3. 完了時にユーザーへ通知メール + Web 画面で表示
    consequences:
      positive: [API timeout 回避, ユーザー UX 良い]
      negative: [完了までに時間差発生]
      mitigation: [進捗バー UI で「処理中」状態を可視化]

  - id: DEC-007
    type: handoff
    title: WMAO 引継ぎを none scope に確定(B 系特殊)
    decided_at: 2026-08-04
    decided_by:
      - role: product-director
        name: product-director
      - role: delivery-director
        name: delivery-director
      - role: 決裁者
        name: Shin
    proposed_by: product-director
    impacted_agents: [delivery-director, WMAO 受領担当(参考)]
    related_artifacts: [PROJECT.md, 06-handoff/dpsai-to-wmao-handoff.yaml]
    context: handoff-protocols.md §8.4 の B 系自社プロダクトフロー適用。
    decision_rationale: |
      自社プロダクトの SaaS 本体は本組織内継続運用が原則。
      集客・LP 改善は aileap_meetingai_lp 案件側で WMAO に partial 引継ぎ済。
      本案件(SaaS 本体)は WMAO 関与なし。
    consequences:
      positive: [プロダクト責任の所在が明確]
      negative: [WMAO の知見が SaaS 本体に流れない]
      mitigation: [将来 WMAO の AI 機能(SaaS 化)経験を逆輸入する余地]


  internal_client: true

# ===============================================================
# 引継ぎスコープ:none(B 系特殊・handoff-protocols.md §8.4)
# ===============================================================
handoff_scope:
  type: none                               # ★ 引継ぎなし
  rationale: |
    本案件は AILEAP 自社プロダクト SaaS の本体(MVP)。
    プロダクト責任は本組織内に永続的に留まる。
    WMAO は SaaS 本体には関与せず、親案件(aileap_meetingai_lp = LP)経由で
    集客 / SEO 改善のみ partial 引継ぎ済。

  wmao_takes_over: []                      # 何も引き継がない

  dpsai_retains:
    - サイト運用・保守(Vercel + Supabase + Inngest)
    - プロダクト機能開発(継続スプリント)
    - β版ユーザーサポート
    - LLM API 運用(コスト監視 + プロンプトチューニング)
    - 重大障害対応
    - 正式版開発(別案件 / 2026-11-15 着手予定)
    - 課金機能実装(正式版)

  wmao_indirect_involvement:               # WMAO が間接的に関与する範囲
    - 集客 LP(aileap_meetingai_lp)の SEO/GEO 改善 → 本案件への流入増加
    - aileap_v2 ブログでの MeetingAI 関連記事継続 → 本案件への被リンク強化

